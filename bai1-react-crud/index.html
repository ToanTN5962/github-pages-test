<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quản lý người dùng</title>
    <script src='https://unpkg.com/react@18/umd/react.development.js'></script> 
    <script src='https://unpkg.com/react-dom@18/umd/react-dom.development.js'></script> 
    <script src='https://unpkg.com/@babel/standalone/babel.min.js'></script>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: #f4f7fb;
            color: #17243b;
            font-family: Arial, sans-serif;
            line-height: 1.5;
        }
        button, input { font: inherit; }
        .app { max-width: 1180px; margin: 0 auto; padding: 32px 20px; }
        h1 { margin: 0 0 24px; font-size: 30px; }
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        .search-input {
            width: min(100%, 360px);
            padding: 10px 12px;
            border: 1px solid #c7d2e0;
            border-radius: 8px;
            background: #fff;
        }
        .search-input:focus, .form-field input:focus {
            outline: 2px solid #2563eb;
            outline-offset: 1px;
        }
        .btn {
            padding: 9px 14px;
            border: 1px solid transparent;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }
        .btn-primary { background: #1d4ed8; color: #fff; }
        .btn-primary:hover { background: #1e40af; }
        .btn-secondary { background: #fff; color: #24344d; border-color: #c7d2e0; }
        .btn-secondary:hover { background: #eef2f7; }
        .btn-delete { background: #fff1f2; color: #b42336; border-color: #fecdd3; }
        .btn-delete:hover { background: #ffe4e6; }
        .row-actions { display: flex; gap: 6px; white-space: nowrap; }
        .table-wrap {
            overflow-x: auto;
            background: #fff;
            border: 1px solid #dce4ee;
            border-radius: 10px;
            box-shadow: 0 4px 16px rgba(22, 35, 58, 0.05);
        }
        .user-table { width: 100%; border-collapse: collapse; min-width: 850px; }
        .user-table th, .user-table td {
            padding: 12px 14px;
            border-bottom: 1px solid #e7edf4;
            text-align: left;
            vertical-align: top;
        }
        .user-table th { background: #eaf0f8; font-size: 14px; }
        .user-table tbody tr:last-child td { border-bottom: 0; }
        .user-table tbody tr:hover { background: #f8faff; }
        .status { padding: 20px; color: #52627a; }
        .modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 999;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            background: rgba(15, 23, 42, 0.5);
        }
        .modal-content {
            width: min(100%, 620px);
            max-height: calc(100vh - 32px);
            overflow-y: auto;
            padding: 24px;
            border-radius: 12px;
            background: #fff;
            box-shadow: 0 20px 50px rgba(15, 23, 42, 0.2);
        }
        .modal-content h2 { margin: 0 0 20px; font-size: 22px; }
        .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
        .form-field { display: flex; flex-direction: column; gap: 5px; }
        .form-field label { font-weight: 600; font-size: 14px; }
        .form-field input {
            width: 100%;
            padding: 9px 10px;
            border: 1px solid #c7d2e0;
            border-radius: 7px;
        }
        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 22px; }
        @media (max-width: 600px) {
            .app { padding: 22px 12px; }
            h1 { font-size: 25px; }
            .search-input { width: 100%; }
            .toolbar > div { width: 100%; }
            .toolbar .btn { width: 100%; }
            .modal-content { padding: 18px; }
            .form-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div id='root'></div>
    <script type="text/babel">
        function SearchForm({ onChangeValue }) {
            return (
                <input
                    className="search-input"
                    type="text"
                    aria-label="Tìm người dùng"
                    placeholder="Tìm theo name, username"
                    onChange={(e) => onChangeValue(e.target.value)}
                />
            );
        }

        function AddUser({ onAdd }) {
            const [adding, setAdding] = React.useState(false); 
            const [user, setUser] = React.useState({ 
                name: "", username: "", email: "", 
                address: { street: "", suite: "", city: "" }, 
                phone: "", website: "" 
            }); 

            const handleChange = (e) => { 
                const { id, value } = e.target; 
                if (["street", "suite", "city"].includes(id)) { 
                    setUser({ ...user, address: { ...user.address, [id]: value } }); 
                } else { 
                    setUser({ ...user, [id]: value }); 
                } 
            }; 

            const handleAdd = () => { 
                if (user.name === "" || user.username === "") { 
                    alert("Vui lòng nhập Name và Username!"); 
                    return; 
                } 
                onAdd(user); 
                setUser({ name: "", username: "", email: "", address: { street: "", 
                            suite: "", city: "" }, phone: "", website: "" }); 
                setAdding(false); 
            };

            return (
                <div> 
                    <button className="btn btn-primary" onClick={() => setAdding(true)}>Thêm người dùng</button>
                    {adding && (
                        <div className="modal-overlay">
                            <div className="modal-content" role="dialog" aria-modal="true" aria-labelledby="add-title">
                                <h2 id="add-title">Thêm người dùng</h2>
                                <div className="form-grid">
                                <div className="form-field">
                                    <label htmlFor="name">Name: </label>
                                    <input id="name" type="text" value={user.name} onChange={handleChange}/>
                                </div>
                                <div className="form-field">
                                    <label htmlFor="username">Username: </label>
                                    <input id="username" type="text" value={user.username} onChange={handleChange}/>
                                </div>
                                <div className="form-field">
                                    <label htmlFor="email">Email: </label>
                                    <input id="email" type="email" value={user.email} onChange={handleChange}/>
                                </div>
                                <div className="form-field">
                                    <label htmlFor="street">Street: </label>
                                    <input id="street" type="text" value={user.address.street} onChange={handleChange}/>
                                </div>
                                <div className="form-field">
                                    <label htmlFor="suite">Suite: </label>
                                    <input id="suite" type="text" value={user.address.suite} onChange={handleChange}/>
                                </div>
                                <div className="form-field">
                                    <label htmlFor="city">City: </label>
                                    <input id="city" type="text" value={user.address.city} onChange={handleChange}/>
                                </div>
                                <div className="form-field">
                                    <label htmlFor="phone">Phone: </label>
                                    <input id="phone" type="tel" value={user.phone} onChange={handleChange}/>
                                </div>
                                <div className="form-field">
                                    <label htmlFor="website">Website: </label>
                                    <input id="website" type="text" value={user.website} onChange={handleChange}/>
                                </div>
                                </div>
                                <div className="modal-actions">
                                    <button className="btn btn-secondary" onClick={() => setAdding(false)}>Hủy</button>
                                    <button className="btn btn-primary" onClick={handleAdd}>Thêm</button>
                                </div>
                            </div> 
                        </div> 
                    )} 
                </div>
            );
        }

        function ResultTable({ keyword, user, onAdded }) {
            const [users, setUsers] = React.useState([]); 
            const [loading, setLoading] = React.useState(true); 
            const [editing, setEditing] = React.useState(null);
            
            React.useEffect(() => { 
                fetch("https://jsonplaceholder.typicode.com/users") 
                .then(res => res.json()) 
                .then(data => { setUsers(data); setLoading(false); }); 
            }, []);

            const filteredUsers = users.filter((u) => 
                u.name.toLowerCase().includes(keyword.toLowerCase()) || 
                u.username.toLowerCase().includes(keyword.toLowerCase()) 
            );

            React.useEffect(() => { 
                if (user) { 
                    setUsers((prev) => [...prev, { ...user, id: prev.length + 1 }]); 
                    onAdded(); 
                } 
            }, [user]); 

            function editUser(user) {
                setEditing({
                    ...user,
                    address: { ...user.address }
                });
            }

            function handleEditChange(field, value) {
                setEditing((prev) => {
                    if (["street", "suite", "city"].includes(field)) {
                        return {
                            ...prev,
                            address: { ...prev.address, [field]: value }
                        };
                    }
                    return { ...prev, [field]: value };
                });
            }

            function saveUser() {
                setUsers((prev) =>
                    prev.map((u) => u.id === editing.id ? editing : u)
                );
                setEditing(null);
            }

            function removeUser(id) {
                // Giữ lại tất cả người dùng có id khác với id cần xóa
                setUsers((prev) => prev.filter((u) => u.id != id));
            }

            return (
                <div>
                    <div className="table-wrap">
                    <table className="user-table">
                        <thead>
                            <tr>
                                <th>ID</th><th>Name</th><th>Username</th><th>Email</th>
                                <th>Address</th><th>Phone</th><th>Thao tác</th>
                            </tr>
                        </thead>
                        <tbody>
                            {filteredUsers.map((u) => (
                                <tr key={u.id}>
                                    <td>{u.id}</td>
                                    <td>{u.name}</td>
                                    <td>{u.username}</td>
                                    <td>{u.email}</td>
                                    <td>
                                        {u.address.street}, {u.address.suite}, {u.address.city}
                                    </td>
                                    <td>{u.phone}</td>
                                    <td>
                                        <div className="row-actions">
                                            <button className="btn btn-secondary" onClick={() => editUser(u)}>Sửa</button>
                                            <button className="btn btn-delete" onClick={() => removeUser(u.id)}>Xóa</button>
                                        </div>
                                    </td>
                                </tr>
                            ))}
                        </tbody>
                    </table>
                    {loading && <div className="status">Đang tải danh sách...</div>}
                    {!loading && filteredUsers.length === 0 && (
                        <div className="status">Không tìm thấy người dùng.</div>
                    )}
                    </div>

                    {editing && (
                        <div className="modal-overlay">
                            <div className="modal-content" role="dialog" aria-modal="true" aria-labelledby="edit-title">
                            <h2 id="edit-title">Sửa người dùng</h2>
                            <div className="form-grid">
                            <div className="form-field">
                                <label htmlFor="edit-name">Name: </label>
                                <input id="edit-name" type="text" value={editing.name}
                                    onChange={(e) => handleEditChange("name", e.target.value)} />
                            </div>
                            <div className="form-field">
                                <label htmlFor="edit-username">Username: </label>
                                <input id="edit-username" type="text" value={editing.username}
                                    onChange={(e) => handleEditChange("username", e.target.value)} />
                            </div>
                            <div className="form-field">
                                <label htmlFor="edit-email">Email: </label>
                                <input id="edit-email" type="email" value={editing.email}
                                    onChange={(e) => handleEditChange("email", e.target.value)} />
                            </div>
                            <div className="form-field">
                                <label htmlFor="edit-street">Street: </label>
                                <input id="edit-street" type="text" value={editing.address.street}
                                    onChange={(e) => handleEditChange("street", e.target.value)} />
                            </div>
                            <div className="form-field">
                                <label htmlFor="edit-suite">Suite: </label>
                                <input id="edit-suite" type="text" value={editing.address.suite}
                                    onChange={(e) => handleEditChange("suite", e.target.value)} />
                            </div>
                            <div className="form-field">
                                <label htmlFor="edit-city">City: </label>
                                <input id="edit-city" type="text" value={editing.address.city}
                                    onChange={(e) => handleEditChange("city", e.target.value)} />
                            </div>
                            <div className="form-field">
                                <label htmlFor="edit-phone">Phone: </label>
                                <input id="edit-phone" type="tel" value={editing.phone}
                                    onChange={(e) => handleEditChange("phone", e.target.value)} />
                            </div>
                            <div className="form-field">
                                <label htmlFor="edit-website">Website: </label>
                                <input id="edit-website" type="text" value={editing.website}
                                    onChange={(e) => handleEditChange("website", e.target.value)} />
                            </div>
                            </div>
                            <div className="modal-actions">
                                <button className="btn btn-secondary" onClick={() => setEditing(null)}>Hủy</button>
                                <button className="btn btn-primary" onClick={saveUser}>Lưu</button>
                            </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function App() {
            const [kw, setKeyword] = React.useState("");
            const [newUser, setNewUser] = React.useState(null);

            return (
                <div className="app">
                    <h1>Quản lý người dùng</h1>
                    <div className="toolbar">
                    <SearchForm onChangeValue={setKeyword} />
                    <AddUser onAdd={setNewUser} />
                    </div>
                    <ResultTable
                        keyword={kw}
                        user={newUser}
                        onAdded={() => setNewUser(null)}
                    />
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
